services:
  postgres:
    image: postgres:16-alpine
    container_name: irctc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irctcpass}
      POSTGRES_DB: ${POSTGRES_DB:-irctc_backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: irctc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-irctcpass}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-irctcpass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
    container_name: irctc-user-service
    environment:
      NODE_ENV: development
      PORT: ${USER_SERVICE_PORT:-4001}
      LOG_LEVEL: info
      SERVICE_NAME: user-service
      DATABASE_URL: postgres://admin:irctcpass@postgres:5432/irctc_backend
      REDIS_URL: redis://:${REDIS_PASSWORD:-irctcpass}@redis:6379
      ALLOWED_ORIGINS: http://localhost:4000,http://localhost:4001,http://localhost:4002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT:-4001}:4001"
    volumes:
      - ./user-service:/app
      - user_service_node_modules:/app/node_modules
    command: npm run dev

  search-service:
    build:
      context: ./search-service
    container_name: irctc-search-service
    environment:
      NODE_ENV: development
      PORT: ${SEARCH_SERVICE_PORT:-4002}
      LOG_LEVEL: info
      SERVICE_NAME: search-service
      REDIS_URL: redis://:${REDIS_PASSWORD:-irctcpass}@redis:6379
      ALLOWED_ORIGINS: http://localhost:4000,http://localhost:4001,http://localhost:4002
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${SEARCH_SERVICE_PORT:-4002}:4002"
    volumes:
      - ./search-service:/app
      - search_service_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  user_service_node_modules:
  search_service_node_modules:

