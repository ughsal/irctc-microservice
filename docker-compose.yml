name: irctc-backend

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irctcpass}
      POSTGRES_DB: ${POSTGRES_DB:-user_service_database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-user_service_database}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irctc-network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - irctc-network

  redis:
    image: redis/redis-stack:6.2.6-v19
    restart: always
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-irctcpass}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-irctcpass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irctc-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - irctc-network

  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   restart: always
  #   depends_on:
  #     - zookeeper
  #   ports:
  #     - "9092:9092"
  #     - "9093:9093"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  #   volumes:
  #     - kafka_data:/var/lib/kafka/data
  #   networks:
  #     - irctc-network

  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   restart: always
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: irctc-cluster
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #     KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  #   networks:
  #     - irctc-network

  user-service:
    build:
      context: ./user-service
    environment:
      NODE_ENV: development
      PORT: ${USER_SERVICE_PORT:-4001}
      LOG_LEVEL: info
      SERVICE_NAME: user-service
      DATABASE_URL: postgres://admin:irctcpass@postgres:5432/user_service_database
      REDIS_URL: redis://:${REDIS_PASSWORD:-irctcpass}@redis:6379
      # KAFKA_BROKER: kafka:9092
      ALLOWED_ORIGINS: http://localhost:4000,http://localhost:4001,http://localhost:4005
      OTP_TTL: 300
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      OTP_RATE_MAX_PER_HOUR: 5
      OTP_MAX_VERIFY_ATTEMPTS: 5
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_SEND: ${MAIL_SEND:-onboarding@resend.dev}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_EXP: 15m
      REFRESH_TOKEN_EXP: 7d
      ACCESS_TOKEN_EXP_SEC: 900
      REFRESH_TOKEN_EXP_SEC: 604800
      INTERNAL_SERVICE_KEY: your_internal_service_key_here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # kafka:
      #   condition: service_started
    ports:
      - "${USER_SERVICE_PORT:-4001}:4001"
    volumes:
      - ./user-service:/app
      - user_service_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - irctc-network

  search-service:
    build:
      context: ./search-service
    environment:
      NODE_ENV: development
      PORT: ${SEARCH_SERVICE_PORT:-4002}
      LOG_LEVEL: info
      SERVICE_NAME: search-service
      REDIS_URL: redis://:${REDIS_PASSWORD:-irctcpass}@redis:6379
      ALLOWED_ORIGINS: http://localhost:4000,http://localhost:4001,http://localhost:4002
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${SEARCH_SERVICE_PORT:-4002}:4002"
    volumes:
      - ./search-service:/app
      - search_service_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - irctc-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  # kafka_data:
  user_service_node_modules:
  search_service_node_modules:

networks:
  irctc-network:
    driver: bridge
